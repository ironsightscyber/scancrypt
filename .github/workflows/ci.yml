name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

# Least privilege by default: the test job needs only read. Jobs that need more
# (build-exe, build-macos) request contents: write at the job level below.
permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: pytest -q

  build-exe:
    needs: test
    runs-on: windows-latest
    permissions:
      contents: read   # build only; signing + release attach happen in the sign-windows job
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"

      # Release gate: a tagged build must match the package version exactly (tag v1.2.3 ==
      # rprt.__version__ "1.2.3"). This is what stops a stale __init__.py version from ever
      # shipping in a release exe or its report footer.
      - name: Version gate (tag must match rprt.__version__)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(python -c 'import rprt; print(rprt.__version__)')"
          if [ "$tag" != "$pkg" ]; then
            echo "::error::Tag v$tag does not match rprt.__version__ ($pkg). Bump src/rprt/__init__.py before tagging."
            exit 1
          fi
          echo "version gate ok: $pkg"

      - run: python build_scripts/build_cli.py       # slim console exe (no Qt)
      - run: python build_scripts/build_windows.py    # full GUI exe

      - name: Report exe sizes
        shell: bash
        run: ls -lh dist/*.exe

      # Hand the unsigned exes to the sign-windows job (tags only). Signing runs there,
      # in the protected `release` environment where the Azure identity is authorized.
      - name: Upload unsigned exes for signing
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: windows-exes-unsigned
          retention-days: 1
          path: |
            dist/scancrypt.exe
            dist/scancrypt-gui.exe

  # Code signing (DigiCert OV cert, key in Azure Key Vault Premium HSM).
  # Runs only on release tags, only after the build passed, and only in the `release`
  # environment -- which is what the Azure federated credential trusts. Auth is OIDC
  # (azure/login), so there is no client secret stored anywhere. Signatures are RFC3161
  # timestamped so they stay valid after the certificate expires.
  sign-windows:
    needs: build-exe
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    environment: release          # binds the OIDC token subject to the federated credential
    permissions:
      id-token: write             # OIDC login to Azure (no stored secret)
      contents: write             # attach the signed exes to the release
    steps:
      - name: Download unsigned exes
        uses: actions/download-artifact@v4
        with:
          name: windows-exes-unsigned
          path: dist
      - name: Azure login (federated OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Install AzureSignTool
        shell: bash
        run: |
          dotnet tool install --global AzureSignTool
          echo "$HOME/.dotnet/tools" >> "$GITHUB_PATH"
      - name: Sign exes (Key Vault key, RFC3161 timestamp)
        shell: bash
        run: |
          token="$(az account get-access-token --resource https://vault.azure.net --query accessToken -o tsv)"
          AzureSignTool sign \
            --azure-key-vault-url "${{ secrets.KEY_VAULT_URI }}" \
            --azure-key-vault-certificate "${{ secrets.CERT_NAME }}" \
            --azure-key-vault-accesstoken "$token" \
            --file-digest sha256 \
            --timestamp-rfc3161 http://timestamp.digicert.com \
            --timestamp-digest sha256 \
            dist/scancrypt.exe dist/scancrypt-gui.exe
      - name: Verify signatures
        shell: pwsh
        run: |
          $sigs = Get-AuthenticodeSignature dist/scancrypt.exe, dist/scancrypt-gui.exe
          $sigs | Format-List Path, Status, StatusMessage
          if ($sigs | Where-Object { $_.Status -ne 'Valid' }) { throw "A signature did not verify" }
      - name: Generate SHA-256 checksums (of the signed exes)
        shell: bash
        run: |
          cd dist
          sha256sum scancrypt.exe > scancrypt.exe.sha256
          sha256sum scancrypt-gui.exe > scancrypt-gui.exe.sha256
          cat *.sha256
      - name: Attach signed exes to the release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/scancrypt.exe
            dist/scancrypt-gui.exe
            dist/scancrypt.exe.sha256
            dist/scancrypt-gui.exe.sha256
      - name: Upload signed exes for the VirusTotal job
        uses: actions/upload-artifact@v4
        with:
          name: windows-exes-signed
          retention-days: 1
          path: |
            dist/scancrypt.exe
            dist/scancrypt-gui.exe

  # Submit the signed release binaries to VirusTotal and append the report links +
  # detection counts to the release notes. Report-only and non-blocking (a VT outage
  # never fails the release). Dormant until a VT_API_KEY secret exists (a free
  # VirusTotal API key); without it the job skips cleanly.
  virustotal:
    needs: sign-windows
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write   # edit the release notes
    env:
      VT_API_KEY: ${{ secrets.VT_API_KEY }}
    steps:
      - name: Download signed exes
        if: ${{ env.VT_API_KEY != '' }}
        uses: actions/download-artifact@v4
        with:
          name: windows-exes-signed
          path: dist
      - name: Submit to VirusTotal and update the release notes
        if: ${{ env.VT_API_KEY != '' }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -uo pipefail
          API="https://www.virustotal.com/api/v3"
          section=$'\n## VirusTotal\n\nAutomated scan of the signed release binaries (report-only):\n'
          ok=0
          for f in dist/scancrypt.exe dist/scancrypt-gui.exe; do
            name="$(basename "$f")"; size=$(stat -c%s "$f")
            echo "::group::$name ($size bytes)"
            if [ "$size" -lt 33554432 ]; then
              resp=$(curl -s -X POST "$API/files" -H "x-apikey: $VT_API_KEY" --form "file=@$f")
            else
              upurl=$(curl -s "$API/files/upload_url" -H "x-apikey: $VT_API_KEY" | python3 -c 'import sys,json;print(json.load(sys.stdin)["data"])')
              resp=$(curl -s -X POST "$upurl" -H "x-apikey: $VT_API_KEY" --form "file=@$f")
            fi
            aid=$(echo "$resp" | python3 -c 'import sys,json;print(json.load(sys.stdin)["data"]["id"])' 2>/dev/null || echo "")
            if [ -z "$aid" ]; then echo "upload failed: $resp"; echo "::endgroup::"; continue; fi
            sha=""; verdict=""
            for i in $(seq 1 24); do
              sleep 20
              a=$(curl -s "$API/analyses/$aid" -H "x-apikey: $VT_API_KEY")
              st=$(echo "$a" | python3 -c 'import sys,json;print(json.load(sys.stdin)["data"]["attributes"]["status"])' 2>/dev/null || echo "")
              echo "poll $i: $st"
              if [ "$st" = "completed" ]; then
                sha=$(echo "$a" | python3 -c 'import sys,json;print(json.load(sys.stdin)["meta"]["file_info"]["sha256"])')
                verdict=$(echo "$a" | python3 -c 'import sys,json;s=json.load(sys.stdin)["data"]["attributes"]["stats"];mal=s.get("malicious",0)+s.get("suspicious",0);tot=mal+s.get("undetected",0)+s.get("harmless",0);print(f"{mal}/{tot}")')
                break
              fi
            done
            if [ -n "$sha" ]; then
              section+="- \`$name\` — $verdict flagged — https://www.virustotal.com/gui/file/$sha"$'\n'
              ok=1
            else
              echo "timed out waiting for $name"
            fi
            echo "::endgroup::"
          done
          if [ "$ok" = "0" ]; then echo "No VirusTotal results to post."; exit 0; fi
          body=$(gh release view "$TAG" --json body -q .body)
          clean=$(printf '%s\n' "$body" | sed '/^## VirusTotal$/,$d')
          printf '%s%s' "$clean" "$section" > /tmp/newbody.md
          gh release edit "$TAG" --notes-file /tmp/newbody.md
          echo "Release notes updated with VirusTotal results."

  build-macos:
    needs: test
    runs-on: macos-latest
    permissions:
      contents: write   # required to attach the app to a release
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      # Same release gate as Windows: a tagged build must match rprt.__version__.
      - name: Version gate (tag must match rprt.__version__)
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(python -c 'import rprt; print(rprt.__version__)')"
          if [ "$tag" != "$pkg" ]; then
            echo "::error::Tag v$tag does not match rprt.__version__ ($pkg)."
            exit 1
          fi
      - run: python build_scripts/make_icon.py    # emits assets/scancrypt.icns
      - run: python build_scripts/build_macos.py   # dist/ScanCrypt.app
      - name: Zip the app bundle
        run: ditto -c -k --keepParent dist/ScanCrypt.app dist/scancrypt-macos.zip
      - uses: actions/upload-artifact@v4
        if: startsWith(github.ref, 'refs/tags/v')
        continue-on-error: true
        with:
          name: scancrypt-macos
          retention-days: 14
          path: dist/scancrypt-macos.zip
      - name: Generate SHA-256 checksum file
        if: startsWith(github.ref, 'refs/tags/v')
        run: cd dist && shasum -a 256 scancrypt-macos.zip > scancrypt-macos.zip.sha256
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/scancrypt-macos.zip
            dist/scancrypt-macos.zip.sha256
