name: Publish PyPI placeholder

# Publishes the ScanCrypt placeholder package to PyPI via Trusted Publishing (OIDC, no
# token secrets). The trusted publisher for project "scancrypt" is registered against this
# repository, workflow "publish.yml", environment "pypi".
#
# ScanCrypt itself is distributed as signed binaries from the Releases page. The PyPI
# package contains no scanner code; it only points people to the download. Run this
# manually when the placeholder needs a new version.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write   # OIDC token for PyPI Trusted Publishing
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install build twine
      - run: python -m build pypi-stub/
      - run: twine check pypi-stub/dist/*
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: pypi-stub/dist/
          skip-existing: true
