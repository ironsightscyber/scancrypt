[project]
name = "scancrypt"
version = "1.2.0"
description = "ScanCrypt is now distributed as a signed Windows application. This package points you to the download."
readme = "README.md"
requires-python = ">=3.8"
license = "LicenseRef-Proprietary"
authors = [{ name = "IronSights", email = "team@scancrypt.org" }]
keywords = ["ransomware", "incident-response", "dfir", "data-recovery", "forensics"]

[project.urls]
Homepage = "https://github.com/ironsightscyber/scancrypt"
Download = "https://github.com/ironsightscyber/scancrypt/releases/latest"

[project.scripts]
scancrypt = "scancrypt_launcher:notice"
scancrypt-gui = "scancrypt_launcher:notice"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["scancrypt_launcher"]
